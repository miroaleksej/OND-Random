name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no build artifacts are tracked
        run: |
          tracked="$(git ls-files | grep -E '(^|/)(build/|dist/|.*\.egg-info/|__pycache__/)' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked build artifacts detected:"
            echo "$tracked"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "requirements-dev.txt:"
          cat requirements-dev.txt
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Validate extractor specs
        run: |
          PYTHONPATH=. python scripts/validate_extractor_spec.py --spec schemas/extractor_spec_ondmax.json
          PYTHONPATH=. python scripts/validate_extractor_spec.py --spec schemas/extractor_spec_toeplitz.json
      - name: Validate ODD artifacts
        run: |
          PYTHONPATH=. python scripts/validate_odd_artifacts.py \
            --observations data/samples/observations_sample.jsonl \
            --ond-art-report data/reports/cases/low_bits_bias/ond_art_report.json \
            --profile data/benchmarks/large/I-ondmax.json \
            --profile data/reports/benchmark_profiles.json \
            --reference-profiles data/benchmarks/reference_profiles.json
