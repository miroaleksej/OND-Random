name: Run Suite

on:
  pull_request:
  push:
    branches: [ main, master ]
  schedule:
    - cron: "0 3 * * 0"

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - name: Run suite (quick)
        run: |
          PYTHONPATH=. python -m ond_random.cli run-suite --suite ond --mode quick --out data/reports/run_suite_ci
      - name: Validate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/reports/run_suite_ci/results.json").read_text(encoding="utf-8"))
          if data["summary"]["overall"] == "error":
              raise SystemExit("run-suite failed")
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: run-suite-quick
          path: data/reports/run_suite_ci

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - name: Run suite (nightly)
        run: |
          PYTHONPATH=. python -m ond_random.cli run-suite --suite ond,nist,testu01,practrand,ea90b --mode full --out data/reports/run_suite_nightly
      - name: Validate results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/reports/run_suite_nightly/results.json").read_text(encoding="utf-8"))
          if data["summary"]["overall"] == "error":
              raise SystemExit("run-suite failed")
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: run-suite-nightly
          path: data/reports/run_suite_nightly
