<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240">
  <style>
    .box { fill: #f7f7f7; stroke: #333; stroke-width: 2; rx: 12; }
    .title { font: 16px sans-serif; fill: #111; }
    .sub { font: 13px sans-serif; fill: #333; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect class="box" x="20" y="70" width="150" height="90" />
  <text class="title" x="40" y="105">Sources</text>
  <text class="sub" x="40" y="128">OS RNG / QRNG</text>

  <rect class="box" x="220" y="70" width="160" height="90" />
  <text class="title" x="240" y="105">Extractor</text>
  <text class="sub" x="240" y="128">ONDMax (SHAKE)</text>

  <rect class="box" x="430" y="70" width="150" height="90" />
  <text class="title" x="450" y="105">OND Metrics</text>
  <text class="sub" x="450" y="128">H_rank / H_sub</text>

  <rect class="box" x="630" y="70" width="150" height="90" />
  <text class="title" x="650" y="105">Benchmarks</text>
  <text class="sub" x="650" y="128">Profiles / Classes</text>

  <rect class="box" x="800" y="70" width="140" height="90" />
  <text class="title" x="820" y="105">Reports</text>
  <text class="sub" x="820" y="128">Quality / Summary</text>

  <line class="arrow" x1="170" y1="115" x2="220" y2="115" />
  <line class="arrow" x1="380" y1="115" x2="430" y2="115" />
  <line class="arrow" x1="580" y1="115" x2="630" y2="115" />
  <line class="arrow" x1="780" y1="115" x2="800" y2="115" />

  <text class="sub" x="20" y="200">Pipeline: source → extraction → structure metrics → benchmarks → reports</text>
</svg>
