[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ond-odd-spec"
version = "0.1.0"
description = "ODD/OND-ART schemas and validation utilities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OND Random"}]
dependencies = [
  "jsonschema>=4.23",
]

[project.scripts]
ond-odd-validate = "ond_odd_spec.cli:main"

[tool.setuptools.packages.find]
include = ["ond_odd_spec*"]

[tool.setuptools.package-data]
ond_odd_spec = ["schemas/*.json"]
