[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ond-random"
version = "0.1.0"
description = "Observed Randomness Dynamics (OND) random system with benchmarks and reports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OND Random"}]

dependencies = [
  "numpy>=1.23",
]

[project.optional-dependencies]
core = []
plot = ["matplotlib>=3.7"]
tda = ["ripser>=0.6.8"]
jax = ["jax>=0.4.23", "jaxlib>=0.4.23"]
cupy = ["cupy>=12.0.0"]
quantum = []
spec = ["ond-odd-spec>=0.3.0"]
dev = [
  "pytest>=8.2",
  "build>=1.2",
  "sigstore>=2.1.5,<3.0",
]
all = [
  "matplotlib>=3.7",
  "ripser>=0.6.8",
  "jax>=0.4.23",
  "jaxlib>=0.4.23",
  "cupy>=12.0.0",
  "ond-odd-spec>=0.3.0",
  "pytest>=8.2",
  "build>=1.2",
  "sigstore>=2.1.5,<3.0",
]

[project.scripts]
ond-random = "ond_random.cli:main"

[tool.setuptools.packages.find]
include = ["ond_random*"]
